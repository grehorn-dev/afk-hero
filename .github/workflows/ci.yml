name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install GCC toolchain
        shell: pwsh
        run: winget install -e --id BrechtSanders.WinLibs.POSIX.UCRT --accept-source-agreements --accept-package-agreements

      - name: Install golangci-lint
        shell: pwsh
        run: winget install -e --id GolangCI.golangci-lint --accept-source-agreements --accept-package-agreements

      - name: Run verification
        shell: pwsh
        run: ./scripts/verify.ps1
